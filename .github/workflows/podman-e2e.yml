name: Podman E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  podman-rootful:
    name: Podman E2E (rootful, 6.1.4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cautem-driver
    env:
      CAUTEM_TESTCONTAINERS: "1"
      CAUTEM_TEST_PODMAN_IMAGE: cautem-podman6-e2e:local
    steps:
      - name: Checkout driver
        uses: actions/checkout@v4
        with:
          path: cautem-driver
      - name: Checkout core
        uses: actions/checkout@v4
        with:
          repository: cautem/cautem-core
          path: cautem-core
          ref: 59fec9b4e887827515979fe01303f2d7152a96f6
      - name: Configure Go workspace
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          cat > go.work <<'EOF'
          go 1.27.0

          use (
            ./cautem-core
            ./cautem-driver
          )
          EOF
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true
          cache-dependency-path: |
            cautem-driver/go.sum
            cautem-core/go.sum
      - name: Build official Podman 6 E2E image
        run: docker build -f tests/e2e/podman/Containerfile.podman6 -t "$CAUTEM_TEST_PODMAN_IMAGE" .
      - name: Run Podman behavioral E2E suite
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/podman-e2e.log"
          go test -v -count=1 -timeout=20m ./tests/e2e/podman 2>&1 | tee "$log"
          for test_name in \
            TestPodmanDriverLifecycleAgainstTestcontainersEngine \
            TestPodmanDriverRecoversAfterServiceRestart \
            TestPodmanPullPolicyNeverFailsClosedBeforeNetworkCreate \
            TestPodmanPullPolicySupportsDigestPinnedImage; do
            if ! grep -F -- "--- PASS: $test_name" "$log" >/dev/null; then
              echo "required Podman E2E test did not pass: $test_name" >&2
              exit 1
            fi
          done
          {
            echo "### Podman behavioral E2E"
            echo "- Engine: rootful $(docker run --rm "$CAUTEM_TEST_PODMAN_IMAGE" podman --version) from Fedora 45 in a disposable privileged container"
            echo "- Required tests passed: 4 (lifecycle, service recovery, pull policy, digest pinning)"
            echo "- Rootless coverage: not included in this job"
          } >> "$GITHUB_STEP_SUMMARY"
